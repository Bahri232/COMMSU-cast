name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    branches: [master, 'ci/**', 'android/**']
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  build-apk:
    name: Android TV & Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Environment
        run: |
          java -version
          flutter --version

      - name: Install Dependencies
        working-directory: sender
        run: flutter pub get

      - name: Run Flutter Tests
        working-directory: sender
        run: flutter test

      - name: Build Android Release APK
        working-directory: sender
        run: flutter build apk --release

      - name: Prepare APK Artifacts
        run: |
          mkdir -p dist
          # Copy universal release APK for Android TV and mobile devices
          cp sender/build/app/outputs/flutter-apk/app-release.apk dist/ComSSUCast-Android-TV.apk
          cp sender/build/app/outputs/flutter-apk/app-release.apk dist/ComSSUCast-Android.apk
          ls -la dist/

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ComSSUCast-Android-TV-APK
          path: dist/*.apk
          retention-days: 30
